version: "3.8"
services:
  english-study:
    build: .
    container_name: english-study-site
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - study-data:/app/data
    networks:
      - english-study-net
      - nekro_network
  english-study-api:
    image: node:22-alpine
    container_name: english-study-api
    working_dir: /app
    command: ["node", "server/api.mjs"]
    env_file:
      - .env
    environment:
      - API_PORT=8787
      - PGHOST=nekro_postgres
    volumes:
      - ./server:/app/server:ro
      - ./node_modules:/app/node_modules:ro
      - ./package.json:/app/package.json:ro
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - english-study-net
      - nekro_network
volumes:
  study-data:
networks:
  english-study-net:
  nekro_network:
    external: true
