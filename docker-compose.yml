version: "3.8"
services:
  english-study:
    build:
      context: .
      dockerfile: Dockerfile.static
    container_name: english-study-site
    ports:
      - "4173:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - study-data:/app/data
    networks:
      - english-study-net
      - nekro_network
  english-study-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: english-study-api
    working_dir: /app
    command: ["node", "server/api.mjs"]
    env_file:
      - .env
    environment:
      - API_PORT=8787
      - PGHOST=nekro_postgres
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - english-study-net
      - nekro_network
volumes:
  study-data:
networks:
  english-study-net:
  nekro_network:
    external: true
